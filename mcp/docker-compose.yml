services:
  kiekie-mcp:
    build: .
    image: kiekie-mcp:latest
    restart: unless-stopped # starts on boot with Docker
    # Loopback-only publish: no auth on the MCP itself is fine because nothing
    # off this machine can reach it.
    ports: ['127.0.0.1:8899:8899']
    environment:
      API_BASE: ${API_BASE:-https://shots.yourdomain.com}
      WEB_BASE: ${WEB_BASE:-https://shots.yourdomain.com}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET}
      # host prefix -> container prefix; the MCP translates incoming file paths.
      # Windows:  C:\Dev=/host/dev
      # macOS/Linux: /Users/roland/dev=/host/dev
      PATH_MAP: ${PATH_MAP:-C:\Dev=/host/dev}
    volumes:
      # Mount just the folder you work in, read-only.
      - ${HOST_WORK_DIR:-C:\Dev}:/host/dev:ro
